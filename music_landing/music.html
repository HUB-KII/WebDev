<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"
        <title> Album Showcase</title>
        <link rel="stylesheet" href="music.css">
    </head>
</html>
<body>

    <div class="album-container">
        <!-- Left Side: Album Artwork -->
        <div class="album-art">
            <img src="https://i.pinimg.com/736x/02/a0/42/02a04256af0143287ed94d405efdd2e5.jpg" alt="Album Cover">
        </div>
        <!-- Right Side: Details & Tracklist -->
         <div class="album-details">
            <h1 class="album-title">OVERATTED</h1>
            <h2 class="artist-name">KII</h2>
            <p class="release-info"> Released: 2026 • 12 Tracks </p>
            
            <h3>Tracklist</h3>
            <ol class="tracklist">
                <li> Ice Cold <span class="duration">3:40</span></li>
                 <li> F.N <span class="duration">1:30</span></li>
                  <li> Traumatized <span class="duration">2:50</span></li>
                   <li> Nobody <span class="duration">3:15</span></li>
            </ol>
            <div class="buttons">
                <a href="#" class="btn play-btn">Listen Now</a>
                <a href="#" class="btn share-btn">Share</a>
            </div>
         </div>
    </div>
</body>
</html>
